# Production LiveKit config sketch. See docs/DEPLOYMENT.md.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
keys:
  # Generate with: livekit-server generate-keys   (put the same pair in the app's env)
  REPLACE_API_KEY: REPLACE_API_SECRET
room:
  # Belt and braces: the app also creates each room with max_participants=2.
  max_participants: 2
  empty_timeout: 300
turn:
  enabled: true
  domain: turn.example.com
  tls_port: 5349
  udp_port: 3478
  external_tls: true
webhook:
  api_key: REPLACE_API_KEY
  urls:
    - https://closeby.example.com/api/livekit/webhook
